# Standardeinstellungen fuer "streamlit run app.py":
# Im Netzwerk erreichbar (nicht nur localhost), damit Mitarbeiter auf dem
# gemeinsamen WTS von ihrem jeweiligen Rechner aus zugreifen koennen - siehe
# .streamlit/secrets.toml (app_password), das ist der Grund, warum das
# vertretbar ist: ohne Passwort waeren die verarbeiteten Kunden-/
# Provisionsdaten sonst fuer jeden im Netzwerk sichtbar.
[server]
address = "0.0.0.0"
headless = true

[browser]
gatherUsageStats = false

# Farbschema angelehnt an das SSH-Logo (dunkles Navy, klassische Serifen-
# Optik, viel Weissraum).
[theme]
primaryColor = "#242A4E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F6"
textColor = "#1A1A1A"
font = "serif"
