# Standardeinstellungen fuer "streamlit run app.py":
# Nur auf localhost erreichbar (nicht im Netzwerk/Internet sichtbar) -
# die verarbeiteten PDFs enthalten Kunden- und Provisionsdaten.
[server]
address = "127.0.0.1"
headless = true

[browser]
gatherUsageStats = false

# Farbschema angelehnt an das SSH-Logo (dunkles Navy, klassische Serifen-
# Optik, viel Weissraum).
[theme]
primaryColor = "#242A4E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F6"
textColor = "#1A1A1A"
font = "serif"
